name: Website
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rust tests
        working-directory: .
        run: cargo test

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          retention-days: 1

  # Separate job so the Cloudflare token never shares a runner with npm install scripts
  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # Deploys run one at a time, in push order
    concurrency:
      group: website-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            web/wrangler.jsonc
            web/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: web/dist

      - name: Deploy to Cloudflare
        working-directory: web
        # The same Wrangler version as the lockfile, without installing the other dependencies
        run: npx --yes "wrangler@$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
